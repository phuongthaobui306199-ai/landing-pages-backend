<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Form Submissions</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, #a3252b 0%, #7d1b20 100%);
      color: white;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 4px 12px rgba(163, 37, 43, 0.15);
    }
    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    header p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }
    .login-section {
      background: white;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .login-section h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #a3252b;
      box-shadow: 0 0 0 3px rgba(163, 37, 43, 0.1);
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #a3252b;
      color: white;
    }
    .btn-primary:hover {
      background: #7d1b20;
      transform: translateY(-1px);
    }
    .btn-danger {
      background: #e74c3c;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-danger:hover {
      background: #c0392b;
    }
    .data-section {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .data-section h2 {
      margin-top: 0;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .count-badge {
      background: #a3252b;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table thead {
      background: #f9f9f9;
      border-bottom: 2px solid #ddd;
    }
    table th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: #555;
    }
    table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    table tr:hover {
      background: #f9f9f9;
    }
    .timestamp {
      color: #999;
      font-size: 12px;
    }
    .hidden { display: none; }
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Admin Dashboard</h1>
      <p>Quản lý danh sách người điền form</p>
    </header>

    <div class="login-section" id="loginSection">
      <h2>Đăng nhập</h2>
      <div class="form-group">
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu (1999)">
      </div>
      <button class="btn btn-primary" onclick="login()">Đăng nhập</button>
      <div id="loginMessage"></div>
    </div>

    <div class="data-section hidden" id="dataSection">
      <div>
        <h2>
          Danh sách submissions
          <span class="count-badge" id="countBadge">0</span>
        </h2>
        <button class="btn btn-primary" onclick="logout()">Đăng xuất</button>
      </div>
      <div id="message"></div>
      <table id="submissionsTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Họ tên</th>
            <th>Số điện thoại</th>
            <th>Email</th>
            <th>Lĩnh vực</th>
            <th>Mục tiêu</th>
            <th>Ngày điền</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" style="text-align: center; padding: 30px;">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentPassword = null;

    function login() {
      const password = document.getElementById('password').value;

      if (!password) {
        showMessage('Vui lòng nhập mật khẩu', 'error', 'loginMessage');
        return;
      }

      fetch(`/api/submissions?password=${password}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage('Mật khẩu không đúng', 'error', 'loginMessage');
            return;
          }
          currentPassword = password;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('dataSection').classList.remove('hidden');
          loadSubmissions();
        })
        .catch(err => {
          showMessage('Lỗi: ' + err.message, 'error', 'loginMessage');
        });
    }

    function logout() {
      currentPassword = null;
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('dataSection').classList.add('hidden');
      document.getElementById('password').value = '';
      document.getElementById('loginMessage').innerHTML = '';
    }

    function loadSubmissions() {
      fetch(`/api/submissions?password=${currentPassword}`)
        .then(res => res.json())
        .then(data => {
          const submissions = data.submissions || [];
          document.getElementById('countBadge').textContent = submissions.length;

          const tbody = document.getElementById('tableBody');

          if (submissions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 30px;">Chưa có dữ liệu</td></tr>';
            return;
          }

          tbody.innerHTML = submissions.map((sub, idx) => `
            <tr>
              <td>${idx + 1}</td>
              <td><strong>${sub.name}</strong></td>
              <td>${sub.phone}</td>
              <td>${sub.email || '-'}</td>
              <td>${sub.industry || '-'}</td>
              <td>${sub.goal || '-'}</td>
              <td><span class="timestamp">${new Date(sub.created_at).toLocaleString('vi-VN')}</span></td>
              <td>
                <button class="btn btn-danger" onclick="deleteSubmission(${sub.id})">Xóa</button>
              </td>
            </tr>
          `).join('');
        })
        .catch(err => {
          showMessage('Lỗi tải dữ liệu: ' + err.message, 'error');
        });
    }

    function deleteSubmission(id) {
      if (!confirm('Bạn chắc chắn muốn xóa?')) return;

      fetch(`/api/submissions/${id}?password=${currentPassword}`, {
        method: 'DELETE'
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            showMessage('Đã xóa', 'success');
            loadSubmissions();
          }
        })
        .catch(err => {
          showMessage('Lỗi xóa: ' + err.message, 'error');
        });
    }

    function showMessage(msg, type, elementId = 'message') {
      const el = document.getElementById(elementId);
      el.className = `message ${type}`;
      el.textContent = msg;
      setTimeout(() => el.innerHTML = '', 3000);
    }
  </script>
</body>
</html>
